<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salle créée - Intrus Game</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Couleurs pastel */
            --bg-blue-light: #e6f7ff;
            --bg-blue-darker: #b3e0ff;
            --orange-soft: #ffd8b3;
            --green-pastel: #c6f6d5;
            --purple-pastel: #e9d8fd;
            --red-pastel: #fed7d7;
            --yellow-pastel: #feebc8;
            --gray-light: #f7fafc;
            --gray-medium: #e2e8f0;
            --gray-dark: #4a5568;
            --text-dark: #2d3748;
            
            /* Typos */
            --font-nunito: 'Nunito', sans-serif;
            
            /* Effets */
            --radius-2xl: 1rem;
            --shadow-soft: 0 4px 6px rgba(0, 0, 0, 0.05);
            --shadow-medium: 0 4px 12px rgba(0, 0, 0, 0.08);
            --transition-normal: all 0.3s ease;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-nunito);
            background: linear-gradient(135deg, var(--bg-blue-light), var(--purple-pastel));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            color: var(--text-dark);
        }
        
        .screen {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            padding: 2rem 0;
        }
        
        .main-title {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
            color: var(--text-dark);
            text-shadow: var(--shadow-soft);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        
        .container {
            width: 100%;
            display: flex;
            justify-content: center;
        }
        
        .game-card {
            background-color: white;
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-medium);
            padding: 2rem;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        
        .game-card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        
        .room-id-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--gray-light);
            border-radius: var(--radius-2xl);
            padding: 0.75rem 1.5rem;
            margin-bottom: 1rem;
        }
        
        .room-id {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--gray-dark);
        }
        
        .copy-btn {
            background-color: var(--orange-soft);
            border: none;
            border-radius: var(--radius-2xl);
            padding: 0.5rem 1rem;
            font-family: var(--font-nunito);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-normal);
            box-shadow: var(--shadow-soft);
        }
        
        .copy-btn:hover {
            background-color: var(--yellow-pastel);
            transform: translateY(-2px);
        }
        
        .input-group {
            display: flex;
            gap: 0.5rem;
            margin: 1rem 0;
        }
        
        .player-input {
            flex: 1;
            padding: 0.75rem 1.25rem;
            border: 2px solid var(--gray-medium);
            border-radius: var(--radius-2xl);
            font-family: var(--font-nunito);
            font-size: 1rem;
            transition: var(--transition-normal);
        }
        
        .player-input:focus {
            outline: none;
            border-color: var(--bg-blue-darker);
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2);
        }
        
        .primary-btn {
            background-color: var(--bg-blue-darker);
            border: none;
            border-radius: var(--radius-2xl);
            padding: 0.75rem 1.5rem;
            font-family: var(--font-nunito);
            font-weight: 700;
            color: var(--text-dark);
            cursor: pointer;
            transition: var(--transition-normal);
            box-shadow: var(--shadow-soft);
        }
        
        .primary-btn:hover {
            background-color: #99d6ff;
            transform: translateY(-2px);
        }
        
        .players-section h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-align: center;
        }
        
        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .player-card {
            background-color: var(--gray-light);
            border-radius: var(--radius-2xl);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            transition: var(--transition-normal);
            box-shadow: var(--shadow-soft);
        }
        
        /* Toast Notifications - Styles intégrés */
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            min-width: 320px;
            max-width: 500px;
            padding: 1.25rem 2rem;
            border-radius: 1rem;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3), 
                        0 5px 20px rgba(0, 0, 0, 0.2);
            z-index: 10000;
            animation: slideDown 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            font-weight: 700;
            border: 2px solid transparent;
            text-align: center;
        }

        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-100px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
            to {
                transform: translateX(-50%) translateY(-100px);
                opacity: 0;
            }
        }

        .notification.success {
            background: linear-gradient(135deg, #10B981 0%, #059669 100%);
            border-color: #ECFDF5;
            color: #FFFFFF;
            box-shadow: 0 15px 50px rgba(16, 185, 129, 0.4), 
                        0 5px 20px rgba(16, 185, 129, 0.3);
        }

        .notification.error {
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            border-color: #FEE2E2;
            color: #FFFFFF;
            box-shadow: 0 15px 50px rgba(239, 68, 68, 0.4), 
                        0 5px 20px rgba(239, 68, 68, 0.3);
        }

        .notification.warning {
            background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
            border-color: #FEF3C7;
            color: #FFFFFF;
            box-shadow: 0 15px 50px rgba(245, 158, 11, 0.4), 
                        0 5px 20px rgba(245, 158, 11, 0.3);
        }

        .notification.info {
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
            border-color: #DBEAFE;
            color: #FFFFFF;
            box-shadow: 0 15px 50px rgba(59, 130, 246, 0.4), 
                        0 5px 20px rgba(59, 130, 246, 0.3);
        }

        .notification-icon {
            font-size: 1.75rem;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
        }

        .notification-content {
            flex: 1;
            font-size: 1.125rem;
            line-height: 1.5;
            font-weight: 700;
            color: #FFFFFF;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        @media (max-width: 480px) {
            .notification {
                top: 15px;
                left: 15px;
                right: 15px;
                transform: translateX(0) translateY(-100px);
                max-width: none;
                min-width: auto;
                padding: 1rem 1.5rem;
            }
            
            @keyframes slideDown {
                from {
                    transform: translateY(-100px);
                    opacity: 0;
                }
                to {
                    transform: translateY(0);
                    opacity: 1;
                }
            }
            
            @keyframes slideUp {
                from {
                    transform: translateY(0);
                    opacity: 1;
                }
                to {
                    transform: translateY(-100px);
                    opacity: 0;
                }
            }
        }
        
        .player-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-medium);
        }
        
        .player-avatar {
            font-size: 2.5rem;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            border-radius: 50%;
            box-shadow: var(--shadow-soft);
        }
        
        .player-name {
            font-weight: 600;
            text-align: center;
            word-break: break-word;
            max-width: 100px;
        }
        
        .next-btn {
            background-color: var(--green-pastel);
            border: none;
            border-radius: var(--radius-2xl);
            padding: 1rem 2.5rem;
            font-family: var(--font-nunito);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-dark);
            cursor: pointer;
            transition: var(--transition-normal);
            box-shadow: var(--shadow-medium);
            margin-top: 1rem;
        }
        
        .next-btn:hover:not(.disabled) {
            background-color: #9ae6b4;
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }
        
        .next-btn:active:not(.disabled) {
            transform: translateY(1px);
        }
        
        .next-btn.disabled {
            background-color: var(--gray-medium);
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        /* Animation pour les nouveaux joueurs */
        @keyframes playerAppear {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        .player-card.new-player {
            animation: playerAppear 0.5s ease forwards;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2rem;
            }
            
            .game-card {
                padding: 1.5rem;
            }
            
            .room-id-display {
                flex-direction: column;
                gap: 0.75rem;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .players-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
        
        /* Copié animation */
        .copied-message {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--green-pastel);
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-2xl);
            font-weight: 600;
            box-shadow: var(--shadow-medium);
            z-index: 1000;
            animation: fadeOut 2s forwards;
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; top: 20px; }
            70% { opacity: 1; top: 20px; }
            100% { opacity: 0; top: 0; }
        }
    </style>
</head>
<body>
    <div id="roomScreen" class="screen">
        <h1 class="main-title">Salle créée ! 🎉</h1>
        
        <div class="container">
            <div class="game-card">
                <h2>ID de la salle</h2>
                <div class="room-id-display">
                    <span class="room-id">ROOM-7B3F</span>
                    <button class="copy-btn">Copier</button>
                </div>
                
                <div class="input-group">
                    <input type="text" class="player-input" placeholder="Votre pseudo">
                    <button class="primary-btn">Ajouter</button>
                </div>
                
                <div class="players-section">
                    <h3>Joueurs dans la salle (<span id="playerCount">0</span>/10)</h3>
                        <div class="players-grid" id="playersGrid">
                            <!-- Les joueurs seront ajoutés ici dynamiquement -->
                        </div>
                </div>
            </div>
        </div>
        
        <button class="next-btn disabled" disabled>Démarrer...</button>
    </div>

    <script>
document.addEventListener('DOMContentLoaded', () => {
  const socket = io();

  // DOM
  const roomIdEl       = document.querySelector('.room-id');
  const copyBtn        = document.querySelector('.copy-btn');
  const nameInput      = document.querySelector('.player-input');
  const addBtn         = document.querySelector('.primary-btn');
  const playersGrid    = document.getElementById('playersGrid');
  const playerCountEl  = document.getElementById('playerCount');
  const startBtn       = document.querySelector('.next-btn');
  const playersSection = document.querySelector('.players-section');

  // State
  let currentRoomId = null;
  let hostAdded     = false;
  let myName        = null;   // <= mémorisé pour /game
  let myAvatar      = null;   // <= mémorisé pour /game

  const animalEmojis = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🦉','🦄','🐴','🦋','🐢','🐍','🦖'];
  const randomAnimal = () => animalEmojis[Math.floor(Math.random() * animalEmojis.length)];
  const escapeHTML = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[char]));

  // 1) Créer la salle
  (async () => {
    try {
      const { roomId } = await fetch('/api/rooms', { method: 'POST' }).then(r => r.json());
      currentRoomId = roomId;
      roomIdEl.textContent = roomId;
    } catch (e) {
      alert('Impossible de créer la salle. Réessaie.');
    }
  })();

  // 2) Copier l’ID
  copyBtn.addEventListener('click', async () => {
    await navigator.clipboard.writeText(roomIdEl.textContent);
    const msg = document.createElement('div');
    msg.className = 'copied-message';
    msg.textContent = 'ID copié dans le presse-papier !';
    document.body.appendChild(msg);
    setTimeout(() => msg.remove(), 2000);
  });

  // 3) Ajouter l'hôte (une seule fois) — on MEMORISE nom + avatar
  addBtn.addEventListener('click', () => {
    if (hostAdded || !currentRoomId) return;
    const name = (nameInput.value || '').trim();
    
    // Validation du pseudo
    if (!name) {
      showNotification('Veuillez entrer un pseudo avant de continuer !', 'warning');
      nameInput.focus();
      return;
    }
    
    if (name.length < 2) {
      showNotification('Le pseudo doit contenir au moins 2 caractères !', 'warning');
      nameInput.focus();
      return;
    }

    if (name.length > 20 || /[<>&"'`]/.test(name)) {
      showNotification('Le pseudo contient des caractères interdits ou dépasse 20 caractères.', 'warning');
      nameInput.focus();
      return;
    }

    myName   = name;            // <<< mémoire
    myAvatar = randomAnimal();  // <<< mémoire

    socket.emit('room:create', { roomId: currentRoomId, name: myName, avatar: myAvatar });
    hostAdded = true;

    nameInput.disabled = true;
    addBtn.disabled = true;
    addBtn.classList.add('disabled');
  });
  
  // Écouter les erreurs serveur pour permettre de réessayer
  socket.on('server:error', (payload) => {
    // Afficher toutes les erreurs serveur comme notifications
    if (payload?.msg) {
      showNotification(payload.msg, 'error');
      
      // Si c'est une erreur de pseudo (déjà utilisé ou invalide), réactiver le formulaire
      if (payload.msg.includes('déjà utilisé') || payload.msg.includes('pseudo') || payload.msg.includes('caractères')) {
        // Réactiver le formulaire pour permettre la modification
        hostAdded = false;
        nameInput.disabled = false;
        addBtn.disabled = false;
        addBtn.classList.remove('disabled');
        
        // Focus et sélection du texte pour faciliter la modification
        setTimeout(() => {
          nameInput.focus();
          nameInput.select();
        }, 300);
      }
    }
  });
  
  // Fonction pour afficher les notifications
  function showNotification(message, type = 'info') {
    // Supprimer les notifications existantes
    const existingNotifications = document.querySelectorAll('.notification');
    existingNotifications.forEach(notif => notif.remove());

    const notification = document.createElement('div');
    notification.className = `notification ${type}`;
    notification.innerHTML = `
      <div class="notification-icon">${type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️'}</div>
      <div class="notification-content">${escapeHTML(message)}</div>
    `;
    document.body.appendChild(notification);
    
    setTimeout(() => {
      notification.style.animation = 'slideUp 0.4s ease-out forwards';
      setTimeout(() => notification.remove(), 400);
    }, 3000);
  }

  // 4) Mises à jour des joueurs
  socket.on('room:update', (players) => {
    playersSection.style.display = 'block';
    playersGrid.innerHTML = '';
    players.forEach(p => {
      const card = document.createElement('div');
      card.className = 'player-card';
      card.innerHTML = `
        <div class="player-avatar">${escapeHTML(p.avatar ?? '🙂')}</div>
        <div class="player-name">${escapeHTML(p.name ?? '???')}</div>
      `;
      playersGrid.appendChild(card);
    });
    playerCountEl.textContent = players.length;
    updateStartBtn(players.length);
  });

  function updateStartBtn(count) {
    if (hostAdded && count >= 3 && count <= 10) {
      startBtn.disabled = false;
      startBtn.classList.remove('disabled');
      startBtn.textContent = 'Démarrer la partie !';
    } else {
      startBtn.disabled = true;
      startBtn.classList.add('disabled');
      startBtn.textContent = (count < 3)
        ? `Encore ${Math.max(0, 3 - count)} joueur${(3 - count) > 1 ? 's' : ''}...`
        : 'Salle pleine';
    }
  }

  // 5) Démarrer (seul l’hôte)
  startBtn.addEventListener('click', () => {
    if (startBtn.disabled || !currentRoomId) return;
    socket.emit('room:start', { roomId: currentRoomId });
  });

  // 6) Quand ça démarre -> stocke EXACTEMENT le même nom/avatar puis /game
  socket.on('room:started', ({ roomId }) => {
    sessionStorage.setItem('intrus_ctx', JSON.stringify({
      roomId,
      name:   myName,     // <<< PAS nameInput.value
      avatar: myAvatar    // <<< PAS un emoji fixe
    }));
    window.location.href = '/game';
  });

  // Logs
  socket.on('connect',       () => console.log('[socket] connecté:', socket.id));
  socket.on('connect_error', (e) => console.warn('[socket] connect_error:', e));
  socket.on('error',         (e) => console.warn('[server error]:', e));
});
</script>


</body>
</html>
